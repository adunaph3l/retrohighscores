{% extends "base.html" %}

{% block title %}Inscription Joueur{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="nes-container is-dark with-title">
        <p class="title nes-text is-success">👾 REJOINDRE L'ARCADE</p>

        <form action="/auth/register" method="post">
            <div class="nes-field" style="margin-bottom: 1.2rem;">
                <label for="username">PSEUDO (3 à 20 caractères) :</label>
                <input type="text" id="username" name="username" class="nes-input is-dark" placeholder="Ex: RetroKing" required minlength="3" maxlength="20" autofocus>
            </div>

            <div class="nes-field" style="margin-bottom: 1.2rem;">
                <label for="email">ADRESSE E-MAIL :</label>
                <input type="email" id="email" name="email" class="nes-input is-dark" placeholder="joueur@arcade.local" required>
            </div>

            <div class="nes-field" style="margin-bottom: 1.5rem;">
                <label for="password">MOT DE PASSE (Min. 6 caractères) :</label>
                <input type="password" id="password" name="password" class="nes-input is-dark" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="nes-btn is-primary" style="width: 100%; margin-bottom: 1rem;">
                CRÉER MON COMPTE
            </button>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 10px;">
                <p>Déjà inscrit ?</p>
                <a href="/auth/login" class="nes-text is-warning">SE CONNECTER &raquo;</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
