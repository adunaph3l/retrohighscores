{% extends "base.html" %}

{% block title %}Connexion Joueur{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="nes-container is-dark with-title">
        <p class="title nes-text is-primary">🕹️ PLAYER 1 : CONNEXION</p>

        <form action="/auth/login" method="post">
            <input type="hidden" name="next" value="{{ next_url or '' }}">

            <div class="nes-field" style="margin-bottom: 1.2rem;">
                <label for="username">PSEUDO ARCADE :</label>
                <input type="text" id="username" name="username" class="nes-input is-dark" placeholder="Ex: PacmanMaster" required autofocus>
            </div>

            <div class="nes-field" style="margin-bottom: 1.5rem;">
                <label for="password">MOT DE PASSE :</label>
                <input type="password" id="password" name="password" class="nes-input is-dark" placeholder="••••••••" required>
            </div>

            <button type="submit" class="nes-btn is-success" style="width: 100%; margin-bottom: 1rem;">
                INSERT COIN (SE CONNECTER)
            </button>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 10px;">
                <p>Pas encore de compte ?</p>
                <a href="/auth/register" class="nes-text is-warning">CRÉER UN COMPTE JOUEUR &raquo;</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
